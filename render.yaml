# Render Blueprint: the API (Fastify + pg-boss jobs) as a Docker web service.
# Database: Supabase Postgres (session pooler URL). Files: Cloudflare R2. Admin web: Vercel.
# Secrets are entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: audit-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      # Supabase → Connect → Session pooler (port 5432, IPv4). Migrations run on every start.
      - key: DATABASE_URL
        sync: false
      # openssl rand -base64 48
      - key: JWT_SECRET
        generateValue: true
      # Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # The Vercel address of the admin web, e.g. https://audit-admin.vercel.app
      - key: WEB_ORIGIN
        sync: false
