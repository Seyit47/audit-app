services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audit}
      POSTGRES_DB: audit
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audit']
      interval: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ['8333:8333']
    volumes:
      - s3data:/data
      - ./infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  api:
    profiles: [prod]
    build: ./apps/api
    env_file: ./apps/api/.env
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_started }
    ports: ['3000:3000']

  admin-web:
    profiles: [prod]
    build: ./apps/admin-web
    env_file: ./apps/admin-web/.env.local
    depends_on: [api]
    ports: ['3001:3001']

volumes:
  pgdata:
  s3data:
