services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audit}
      POSTGRES_DB: audit
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audit']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-audit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-auditaudit}
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-audit} $${MINIO_ROOT_PASSWORD:-auditaudit}; do sleep 1; done;
      mc mb --ignore-existing local/audit-photos"

  api:
    profiles: [prod]
    build: ./apps/api
    env_file: ./apps/api/.env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    ports: ['3000:3000']

  admin-web:
    profiles: [prod]
    build: ./apps/admin-web
    env_file: ./apps/admin-web/.env.local
    depends_on: [api]
    ports: ['3001:3001']

volumes:
  pgdata:
  miniodata:
