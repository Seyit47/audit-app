name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: audit, POSTGRES_PASSWORD: audit, POSTGRES_DB: audit_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U audit" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://audit:audit@localhost:5432/audit_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-32
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: audit-photos-test
      S3_ACCESS_KEY: audit
      S3_SECRET_KEY: auditaudit
      WEB_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - name: Start S3 (SeaweedFS)
        working-directory: .
        run: docker run -d -p 8333:8333 -v "$PWD/infra/seaweedfs-s3.json:/etc/s3.json:ro" chrislusf/seaweedfs server -volume.max=0 -master.volumeSizeLimitMB=256 -s3 -s3.port=8333 -s3.config=/etc/s3.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma migrate status
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  admin-web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/admin-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # Generates Next's route types (PageProps, RouteContext) first; plain tsc fails on a clean checkout.
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
